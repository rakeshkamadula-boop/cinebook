
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | CineBook</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .bookings-section {
            max-width: 1050px;
            margin: 45px auto;
            padding: 25px;
            animation: cardEnter .7s ease both;
        }

        .bookings-section h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 12px;
        }

        .bookings-subtitle {
            text-align: center;
            color: #a9c9e8;
            margin-bottom: 35px;
        }

        #bookingList {
            display: grid;
            gap: 20px;
        }

        #bookingList > div {
            background: linear-gradient(145deg, #142943, #091426);
            border: 1px solid #168cff;
            border-radius: 14px;
            padding: 25px;
            color: white;
            box-shadow: 0 0 18px rgba(22,140,255,.12);
            transition: .3s ease;
        }

        #bookingList > div:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 22px rgba(22,140,255,.3);
        }

        #bookingList h3 {
            color: #00d9ff;
            margin-bottom: 15px;
        }

        #bookingList p {
            color: #d5eaff;
            margin: 10px 0;
        }

        #bookingList button {
            margin-top: 15px;
            padding: 11px 20px;
            background: #e53935;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: .25s ease;
        }

        #bookingList button:hover {
            background: #ff5252;
            box-shadow: 0 0 14px rgba(229,57,53,.5);
            transform: translateY(-2px);
        }

        @media(max-width: 600px) {
            .bookings-section {
                margin: 25px 10px;
                padding: 12px;
            }

            #bookingList > div {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <h1 class="logo">CINE<span>BOOK</span></h1>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<section class="bookings-section">
    <h1>My Bookings</h1>
    <p class="bookings-subtitle">
        Your movie tickets and booking history
    </p>

    <div id="bookingList">
        <p>Loading your bookings...</p>
    </div>
</section>

<script src="my-bookings.js"></script>

</body>
</html>
